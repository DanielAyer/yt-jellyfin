<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ channel.channel_name }} — Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/videos.css" />
</head>
<body>

  <!-- ── GLOBAL DISK WARNING BANNER ──────────────────────────────────── -->
  <div id="disk-warning-banner" class="disk-warning-banner hidden">
    <span class="disk-warning-icon">⚠</span>
    <span id="disk-warning-text">Warning: Low Disk Space</span>
    <button id="disk-warning-close" class="disk-warning-close" title="Dismiss">✕</button>
  </div>

  <!-- ── INLINE ALERT (download blocked) ──────────────────────────────── -->
  <div id="alert-bar" class="alert-bar hidden">
    <span id="alert-bar-text"></span>
    <button id="alert-bar-close" class="disk-warning-close">✕</button>
  </div>

  <!-- ── CONTEXTUAL LOG STRIP ──────────────────────────────────────────── -->
  <div id="log-strip" class="log-strip collapsed" data-channel-id="{{ channel.channel_id }}">
    <div class="log-strip-header">
      <span class="log-strip-title">CHANNEL LOGS — {{ channel.channel_name }}</span>
      <span class="log-strip-badge hidden"></span>
      <span class="log-strip-toggle">▼</span>
    </div>
    <div class="log-strip-body"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <a href="/" style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;">
          <span class="logo-mark">◀</span>
          <span class="logo-text" style="color:var(--muted);">Back</span>
        </a>
        <span class="logo-divider">|</span>
        {% if channel.thumbnail_url %}
          <img src="{{ channel.thumbnail_url }}" class="header-channel-thumb" alt="" />
        {% endif %}
        <span class="logo-text">{{ channel.channel_name }}</span>
      </div>
      <div class="header-actions">
        <a href="/logs" class="btn btn-ghost">Logs</a>
        <button id="btn-refresh" class="btn btn-ghost">↺ Refresh</button>
      </div>
    </div>
  </header>

  <main class="videos-main">
    <!-- download control bar -->
    <div class="download-control-bar">
      <div class="download-control-buttons">
        <button id="btn-dl-all" class="btn btn-primary btn-sm">Download All</button>
        <button id="btn-dl-next-n" class="btn btn-primary btn-sm">Download Next <span id="n-label">N</span></button>
        <button id="btn-dl-latest-m" class="btn btn-primary btn-sm">Download Latest <span id="m-label">M</span></button>
        <button id="btn-dl-selected" class="btn btn-accent btn-sm" disabled>Download Selected (<span id="selected-count">0</span>)</button>
        <button id="btn-force-stop" class="btn btn-danger btn-sm hidden">⏹ Stop</button>
      </div>
      <div id="size-estimate" class="size-estimate hidden"></div>
      <div id="dl-progress-wrap" class="dl-progress-wrap">
        <div class="dl-progress-text">
          <span id="dl-progress-label">Downloading</span>
          <span id="dl-progress-count"></span>
        </div>
        <div class="dl-progress-bar-wrap">
          <div id="dl-progress-bar" class="dl-progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- filter bar -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Not Downloaded</button>
      <button class="filter-btn" data-filter="downloaded">Downloaded</button>
      <div class="filter-spacer"></div>
      <button id="btn-select-all" class="btn btn-ghost btn-sm">Select All</button>
      <button id="btn-deselect-all" class="btn btn-ghost btn-sm">Deselect All</button>
    </div>

    <!-- status bar -->
    <div id="download-status" class="download-status hidden"></div>

    <!-- video grid -->
    <div id="video-grid" class="video-grid">
      <div class="empty-state" id="grid-empty">
        <span class="empty-icon">⏳</span>
        <p>Loading videos…</p>
      </div>
    </div>
  </main>

  <!-- video tile template -->
  <template id="tpl-video-tile">
    <div class="video-tile" data-video-id="" data-status="">
      <div class="tile-thumb-wrap">
        <img class="tile-thumb" src="" alt="" loading="lazy" />
        <div class="tile-overlay"></div>
        <div class="tile-badge hidden">
          <span class="tile-badge-check">✓</span>
          <span class="tile-badge-label">Download</span>
        </div>
        <div class="tile-downloaded-badge hidden">✓ Downloaded</div>
      </div>
      <div class="tile-info">
        <p class="tile-title"></p>
        <p class="tile-date muted"></p>
      </div>
    </div>
  </template>

  <script>
    // Pass channel data to JS
    window.CHANNEL_ID = "{{ channel.channel_id }}";
  </script>
  <script src="/static/js/videos.js"></script>
  <script src="/static/js/log_strip.js"></script>
</body>
</html>
